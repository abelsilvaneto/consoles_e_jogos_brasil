<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/console_cadastrar.js" defer></script>
    <title>Cadastrar Console - PixelFix</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Console</h1>
        <form>
            <label for="modelo">Modelo</label><br>
            <input type="text" id="modelo" required><br><br>

            <label for="marca">Marca (ex: Sony, Nintendo)</label><br>
            <input type="text" id="marca" required><br><br>

            <label for="numeroSerie">numero de serie</label><br>
            <input type="text" id="numeroSerie" required><br><br>

            <label for="tipoServico">Tipo de Serviço</label><br>
            <input type="text" id="tipoServico" required><br><br>

            <label for="idCliente">codigo do cliente</label><br>
            <input type="text" id="idCliente" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
